# C:\Games\ELK\logstash-9.4.2\config\sentinel-pipeline.conf
# Runs on: HOST Windows 11
# Normalizes all incoming logs to ECS schema

input {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "sentinel-windows-*"
    query => '{"query": {"range": {"@timestamp": {"gte": "now-5m"}}}}'
    schedule => "*/5 * * * *"
  }
}

filter {
  # Normalize Windows source IP to ECS
  if [winlog][event_data][IpAddress] {
    mutate {
      rename => { "[winlog][event_data][IpAddress]" => "[source][ip]" }
    }
  }

  # Normalize process name
  if [winlog][event_data][NewProcessName] {
    mutate {
      rename => { "[winlog][event_data][NewProcessName]" => "[process][executable]" }
    }
    # Extract just filename from full path
    grok {
      match => { "[process][executable]" => ".+\\%{GREEDYDATA:[process][name]}" }
    }
  }

  # Normalize command line
  if [winlog][event_data][CommandLine] {
    mutate {
      rename => { "[winlog][event_data][CommandLine]" => "[process][command_line]" }
    }
  }

  # GeoIP enrichment for external IPs
  if [destination][ip] {
    geoip {
      source => "[destination][ip]"
      target => "[destination][geo]"
    }
  }

  # Add event category based on Event ID
  if [winlog][event_id] == 4624 {
    mutate { add_field => { "[event][category]" => "authentication" } }
    mutate { add_field => { "[event][action]" => "logged-in" } }
  } else if [winlog][event_id] == 4625 {
    mutate { add_field => { "[event][category]" => "authentication" } }
    mutate { add_field => { "[event][action]" => "logon-failed" } }
  } else if [winlog][event_id] == 1 {
    mutate { add_field => { "[event][category]" => "process" } }
    mutate { add_field => { "[event][action]" => "process-started" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "sentinel-normalized-%{+yyyy.MM.dd}"
  }
}